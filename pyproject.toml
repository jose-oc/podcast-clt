[project]
name = "podcast-ctl"
version = "0.2.1"
description = "Fast, modular CLI to discover, inspect, and transcribe podcast episodes and YouTube shows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jose OC" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "feedparser>=6.0.10",
    "httpx>=0.27.0",
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=1.0.0",
    "defusedxml>=0.7.1",
    "questionary>=2.0.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# Tier 3 (local Whisper) pulls in heavy native dependencies (CTranslate2,
# torch-free but large). Install only if you want local transcription:
#   pip install 'podcast-ctl[whisper]'
whisper = [
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
podcast-ctl = "podcast_ctl.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that hit real external services (feeds, YouTube, search APIs). They skip on transient network errors or provider IP blocks instead of failing.",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "E501",  # line length is informational; the codebase has long log/message lines
    # The terminal UI intentionally uses non-ASCII glyphs (emoji, ℹ, arrows).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["podcast_ctl"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Lenient by default: this codebase is not fully annotated yet.
# Tighten (disallow_untyped_defs, strict, ...) progressively.
disable_error_code = []
exclude = ["tests/"]
