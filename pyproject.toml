[project]
name = "podcast-ctl"
version = "0.1.0"
description = "Fast, modular CLI to discover, inspect, and transcribe podcast episodes and YouTube shows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jose OC" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "feedparser>=6.0.10",
    "httpx>=0.27.0",
    "yt-dlp>=2024.3.10",
    "youtube-transcript-api>=0.6.2",
    "faster-whisper>=1.0.0",
    "defusedxml>=0.7.1",
    "questionary>=2.0.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[project.scripts]
podcast-ctl = "podcast_ctl.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
